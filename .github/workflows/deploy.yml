# ══════════════════════════════════════════════════════════════
# CD — LaBioTrack : Deploy auto sur VPS apres push sur master
# ══════════════════════════════════════════════════════════════
name: Deploy

on:
  push:
    branches: [master]

  # Permet le declenchement manuel depuis GitHub
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    # Ne deployer que si le CI passe
    needs: []

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          # Auth par clé Ed25519 (secret VPS_SSH_KEY).
          # Migration depuis VPS_PASSWORD suite à compromission SSH brute-force
          # détectée le 24 mai 2026 — cf. doc incident sécurité.
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -e
            echo "══════════════════════════════════════"
            echo "  LaBioTrack — Deploiement auto"
            echo "══════════════════════════════════════"

            # ── 1. Pull du code (sans toucher storage/bootstrap) ────
            cd /docker/labiotrack-web/code
            git fetch origin master
            git checkout origin/master -- $(git diff --name-only HEAD origin/master | grep -v '^storage/' | grep -v '^bootstrap/cache/')
            git reset --soft origin/master

            # ── 2. Permissions www-data (avant composer pour eviter erreurs) ──
            sudo docker exec -u root labiotrack-app chown -R www-data:www-data /var/www/html/storage /var/www/html/bootstrap/cache /var/www/html/vendor
            sudo docker exec -u root labiotrack-app chmod -R 775 /var/www/html/storage /var/www/html/bootstrap/cache

            # ── 3a. Installer ext-gd si manquant ─────
            sudo docker exec -u root labiotrack-app bash -c "php -m | grep -q gd || (apt-get update && apt-get install -y libpng-dev libjpeg-dev libfreetype6-dev && docker-php-ext-configure gd --with-freetype --with-jpeg && docker-php-ext-install gd)"

            # ── 3b. Installer ext-bcmath si manquant (requis par dragon-code/support → laravel-lang/lang) ──
            sudo docker exec -u root labiotrack-app bash -c "php -m | grep -q bcmath || docker-php-ext-install bcmath"

            # ── 4. Composer install ──────────────────
            sudo docker exec labiotrack-app composer install --no-dev --optimize-autoloader --no-interaction

            # ── 5. Migrations (si nouvelles) ─────────
            sudo docker exec labiotrack-app php artisan migrate --force

            # ── 5b. Seed du réseau par défaut (idempotent) ──
            sudo docker exec labiotrack-app php artisan db:seed --class=ReseauSeeder --force

            # ── 6. Cache Laravel ─────────────────────
            sudo docker exec labiotrack-app php artisan config:cache
            sudo docker exec labiotrack-app php artisan route:cache
            sudo docker exec labiotrack-app php artisan view:cache
            sudo docker exec labiotrack-app php artisan event:cache

            # ── 7. Redemarrer le conteneur ───────────
            cd /docker/labiotrack-web
            sudo docker compose restart app

            echo "══════════════════════════════════════"
            echo "  Deploiement termine avec succes !"
            echo "══════════════════════════════════════"
