# ══════════════════════════════════════════════════════════════
# CI — LaBioTrack : Lint + Tests sur chaque push / PR
# ══════════════════════════════════════════════════════════════
name: CI

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master]

jobs:
  lint-and-test:
    name: PHP Lint & Tests
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          # Root sans mot de passe → aligné avec phpunit.xml (DB_PASSWORD vide)
          # et avec l'environnement de dev local (XAMPP). Base dédiée biomed_test.
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: biomed_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring, xml, mysql, gd, zip, bcmath, intl
          coverage: none

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Copy .env
        run: cp .env.example .env

      - name: Generate app key
        run: php artisan key:generate

      - name: PHP Syntax Check
        run: find app config routes -name "*.php" -exec php -l {} \; | grep -v "No syntax errors"  || true

      # La config BDD des tests vient de phpunit.xml (mysql / biomed_test / root
      # sans mot de passe). RefreshDatabase migre la base à chaque suite : pas
      # besoin d'étape migrate séparée. Le manifest Vite (public/build) est
      # versionné, donc les vues @vite se rendent en test.
      - name: Run tests
        run: php artisan test
