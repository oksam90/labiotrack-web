# ──────────────────────────────────────────────────────────────
# Nginx — labiotrack.tech  (Hostinger VPS / Ubuntu)
# ──────────────────────────────────────────────────────────────

# Redirect HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name labiotrack.tech www.labiotrack.tech;
    return 301 https://www.labiotrack.tech$request_uri;
}

# Redirect apex → www (HTTPS)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name labiotrack.tech;

    ssl_certificate     /etc/letsencrypt/live/labiotrack.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/labiotrack.tech/privkey.pem;

    return 301 https://www.labiotrack.tech$request_uri;
}

# Main server block
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.labiotrack.tech;

    # ── SSL (Let's Encrypt / Certbot) ─────────────────────────
    ssl_certificate     /etc/letsencrypt/live/labiotrack.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/labiotrack.tech/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # ── Racine Laravel ────────────────────────────────────────
    root /var/www/labiotrack-web/public;
    index index.php;

    charset utf-8;

    # ── Logs ──────────────────────────────────────────────────
    access_log /var/log/nginx/labiotrack-access.log;
    error_log  /var/log/nginx/labiotrack-error.log;

    # ── Taille max upload (PDF rapports, imports) ─────────────
    client_max_body_size 20M;

    # ── Headers sécurité ──────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── Laravel front controller ──────────────────────────────
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # ── PHP-FPM ───────────────────────────────────────────────
    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    # ── Assets statiques (cache longue durée) ─────────────────
    location ~* \.(css|js|ico|png|jpg|jpeg|gif|svg|woff2?|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── Bloquer les fichiers sensibles ────────────────────────
    location ~ /\.(?!well-known) {
        deny all;
    }

    location ~ \.(env|sql|log)$ {
        deny all;
    }
}
